# pnpm 默认禁止依赖执行安装脚本，这里显式声明（两者都不需要执行）：
# - core-js：postinstall 只打印赞助信息
# - @swc/core：postinstall 仅在原生二进制缺失时回退安装 wasm 版，正常平台无需执行
allowBuilds:
  core-js: false
  '@swc/core': false

# 传递依赖安全修复（pnpm 12+ 配置写在本文件，不再使用 package.json 的 pnpm.overrides）
overrides:
  tinypool: ^2.1.2
  serialize-javascript: ^7.1.3
  katex: ^0.19.1

